<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>에이전트 모니터</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f4f6; --card:#fff; --tx:#191f28; --ts:#8b95a1; --line:#e5e8eb;
    --blue:#3182f6; --green:#00c473; --red:#f04452; --yellow:#f5a623; --purple:#8b5cf6;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',sans-serif;padding:14px;font-size:14px;}
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border-radius:18px;padding:14px 18px;box-shadow:0 2px 8px rgba(0,0,0,.04);margin-bottom:14px;}
  .top .clock{font-size:24px;font-weight:800;}
  .top .date{font-size:13px;color:var(--ts);}
  .chip{font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;}
  .chip.on{background:#e7f6ee;color:var(--green);}
  .chip.off{background:#f1f3f5;color:var(--ts);}
  .score{margin-left:auto;text-align:right;}
  .score .v{font-size:26px;font-weight:800;color:var(--blue);}
  .score .l{font-size:11px;color:var(--ts);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;}
  .card{background:var(--card);border-radius:18px;padding:16px 18px;box-shadow:0 2px 8px rgba(0,0,0,.04);}
  .card h3{font-size:15px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:7px;}
  .card .sub{font-size:11px;color:var(--ts);margin-bottom:12px;}
  .big{font-size:17px;font-weight:700;line-height:1.5;margin-bottom:8px;}
  .row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px;}
  .row:first-of-type{border-top:none;}
  .row .k{color:var(--ts);}
  .row .v{font-weight:700;}
  .pos{color:var(--red);} .neg{color:var(--blue);} .mut{color:var(--ts);}
  .pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;display:inline-block;}
  .pill.ok{background:#e7f6ee;color:var(--green);} .pill.no{background:#fdecee;color:var(--red);}
  .pill.warn{background:#fef4e5;color:var(--yellow);}
  .ind{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;border-top:1px solid var(--line);}
  .ind .dot{font-size:15px;}
  .ind .txt{flex:1;}
  .list{font-size:13px;}
  .list .li{padding:6px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;}
  .list .li:first-child{border-top:none;}
  .muted-card{color:var(--ts);font-size:13px;padding:6px 0;}
  .barwrap{background:#f1f3f5;border-radius:8px;height:10px;overflow:hidden;margin-top:6px;}
  .bar{height:100%;background:var(--blue);border-radius:8px;}
</style>
</head>
<body>
  <div class="top">
    <div>
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date">백테스트 날짜 —</div>
    </div>
    <span class="chip off" id="run">정지</span>
    <div class="score"><div class="v" id="score">–</div><div class="l">종합 점수</div></div>
  </div>
  <div class="grid" id="grid"><div class="muted-card">백테스트를 시작하면 에이전트들의 생각이 여기에 표시돼요…</div></div>

<script>
const $=id=>document.getElementById(id);
const won=n=>(n==null?'—':Number(n).toLocaleString()+'원');
const pct=v=>(v==null?'—':(v>0?'+':'')+Number(v).toFixed(2)+'%');
const cls=v=>v>0?'pos':(v<0?'neg':'mut');

// ── 쉬운 한국어 변환기 ──
function signalText(s){
  return {STRONG_ENTRY:'✅ 지금 사기 좋아요',CONDITIONAL_ENTRY:'🤔 조건 맞으면 살 만해요',NO_ENTRY:'⏸️ 아직 살 때가 아니에요'}[s]||'분석 중…';
}
function indText(it){
  const ok=it.passed, v=it.value;
  switch(it.name){
    case 'volume': return [ok?'🔥':'💤', ok?'거래량이 확 늘었어요':'거래량이 잠잠해요'];
    case 'rsi': return ['📈', `모멘텀 ${v!=null?Math.round(v):'?'}점 ${ok?'(적당해요)':'(안 맞아요)'}`];
    case 'macd': return [ok?'🌊':'🔻', ok?'상승 추세로 돌아섰어요':'추세가 약해요'];
    case 'ma': return [ok?'📐':'📏', ok?'이평선 우상향 정배열':'정배열 아니에요'];
    case 'candle': return [ok?'🕯️':'➖', ok?'좋은 캔들 모양 나왔어요':'특별한 모양은 없어요'];
    default: return ['•', it.detail||''];
  }
}
function marketText(g){
  return {GREEN:'🟢 시장이 평온해요',YELLOW:'🟡 조금 조심스러워요',RED:'🔴 위험해요 (신규 진입 금지)',BLACK:'⚫ 비상정지 상태예요'}[g]||'확인 중…';
}
function riskRejectText(rule,reason){
  const m={
    'HL-01':'🈵 이미 종목 3개를 꽉 채웠어요',
    'HL-02':'😮‍💨 연속으로 손해봐서 1시간 쉬는 중이에요',
    'HL-03':'🕝 오후 2시 반이 지나서 새로 못 사요',
    'HL-04':'🌅 장 초반이라 아직 못 사요',
    'HL-05':'↔️ 사려는 가격 차이가 너무 커요',
    'HL-06':'💳 신용 한도가 모자라요',
    'MARKET_RED':'🔴 시장이 안 좋아서 멈췄어요',
    'MARKET_BLACK':'⚫ 비상정지로 멈췄어요',
    'MARKET_YELLOW_CONDITIONAL':'🟡 시장이 애매해서 조건부 진입은 막았어요',
    'SIZING':'💸 살 돈이 부족해요',
  };
  return m[rule]||('🛑 '+(reason||'규칙에 걸려 막았어요'));
}

function card(emoji,title,sub,bodyHtml){
  return `<div class="card"><h3>${emoji} ${title}</h3><div class="sub">${sub}</div>${bodyHtml}</div>`;
}

function renderCEO(a){
  const c=a.ceo||{};
  const mode=c.mode==='live'?'🔴 실전 모드':'🧪 모의(백테스트) 모드';
  return card('🧑‍💼','대표(CEO)','전체를 지휘하고 모드를 관리해요',
    `<div class="big">${mode}</div>
     <div class="row"><span class="k">진행한 거래일</span><span class="v">${c.days||0}일</span></div>
     <div class="row"><span class="k">받은 개선 제안</span><span class="v">${c.proposals||0}건</span></div>`);
}
function renderScreening(a){
  const s=a.screening||{}; const top=(s.top||[]).slice(0,6);
  let rows=top.map(t=>`<div class="li"><span>${t.name||t.code}</span><span class="v">${Math.round(t.score)}점</span></div>`).join('')
    || '<div class="muted-card">아직 고른 종목이 없어요</div>';
  return card('🔍','종목 찾기(스크리닝)','오늘 살 만한 종목을 점수로 추려요',
    `<div class="big">📋 ${s.count||0}개 종목 발견</div><div class="list">${rows}</div>`);
}
function renderMarket(a){
  const m=a.market;
  if(!m) return card('🌤️','시장 분위기','전체 시장이 살 만한 상황인지 봐요','<div class="muted-card">확인 중…</div>');
  return card('🌤️','시장 분위기','전체 시장이 살 만한 상황인지 봐요',
    `<div class="big">${marketText(m.grade)}</div>
     <div class="row"><span class="k">코스피</span><span class="v ${cls(m.kospi)}">${pct(m.kospi)}</span></div>
     <div class="row"><span class="k">코스닥</span><span class="v ${cls(m.kosdaq)}">${pct(m.kosdaq)}</span></div>
     ${m.vix!=null?`<div class="row"><span class="k">공포지수(VIX)</span><span class="v">${Number(m.vix).toFixed(1)}</span></div>`:''}`);
}
function renderSignal(a){
  const s=a.signal;
  if(!s) return card('📊','신호 분석','5가지 지표로 매수 타이밍을 봐요','<div class="muted-card">분석 대기 중…</div>');
  let inds=(s.indicators||[]).map(it=>{const[d,t]=indText(it);return `<div class="ind"><span class="dot">${it.passed?'🟢':'⚪'}</span><span class="txt">${t}</span></div>`;}).join('');
  const verdict=signalText(s.signal);
  return card('📊','신호 분석',`${s.symbol||''} · 5개 중 ${s.scoreCount||0}개 통과`,
    `<div class="big">${verdict}</div>${inds}`);
}
function renderRisk(a){
  const r=a.risk;
  if(!r) return card('🛡️','안전 점검(리스크)','규칙에 어긋나지 않는지 확인해요','<div class="muted-card">대기 중…</div>');
  if(r.decision==='APPROVE')
    return card('🛡️','안전 점검(리스크)','규칙에 어긋나지 않는지 확인해요',
      `<div class="big"><span class="pill ok">👍 주문 통과</span></div>
       <div class="row"><span class="k">종목</span><span class="v">${r.symbol}</span></div>
       <div class="row"><span class="k">수량/가격</span><span class="v">${r.qty}주 @${won(r.price)}</span></div>`);
  return card('🛡️','안전 점검(리스크)','규칙에 어긋나지 않는지 확인해요',
    `<div class="big"><span class="pill no">✋ 진입 막음</span></div>
     <div style="margin-top:8px;font-size:14px;font-weight:600;">${riskRejectText(r.rule,r.reason)}</div>`);
}
function renderOrder(a){
  const o=a.order;
  if(!o) return card('🧾','주문 실행','실제로 사고 파는 일을 해요','<div class="muted-card">주문 없음</div>');
  const ok=o.status==='filled';
  const side=o.side==='buy'?'매수':(o.side==='sell'?'매도':'');
  return card('🧾','주문 실행','실제로 사고 파는 일을 해요',
    `<div class="big">${ok?'✅ 체결됐어요':'❌ 주문 실패'}</div>
     <div class="row"><span class="k">${side} 종목</span><span class="v">${o.name||o.code||'—'}</span></div>
     ${ok?`<div class="row"><span class="k">수량/가격</span><span class="v">${o.qty}주 @${won(o.price)}</span></div>`:`<div class="muted-card">${o.msg||''}</div>`}`);
}
function renderLearning(a){
  const l=a.learning||{}; const ps=(l.proposals||[]);
  let rows=ps.map(p=>`<div class="li"><span>${p.kind||'제안'}</span><span class="mut" style="font-weight:400;">${(p.rationale||'').slice(0,30)}</span></div>`).join('')
    || '<div class="muted-card">하루가 끝나면 패턴을 분석해 제안해요</div>';
  return card('📚','학습부','매매를 복기하고 더 나은 전략을 제안해요',
    `<div class="big">💡 개선 제안 ${ps.length}건</div><div class="list">${rows}</div>`);
}
function renderMeta(a){
  const m=a.meta||{};
  const pf=m.profitFactor==null?'∞':Number(m.profitFactor).toFixed(2);
  return card('🧠','메타(총괄 분석)','전체 성과와 효율을 점수로 봐요',
    `<div class="big">종합 ${m.perfScore!=null?m.perfScore:'–'}점</div>
     <div class="barwrap"><div class="bar" style="width:${m.perfScore||0}%"></div></div>
     <div class="row" style="margin-top:8px;"><span class="k">매매 승률</span><span class="v">${m.winRate!=null?m.winRate+'%':'—'}</span></div>
     <div class="row"><span class="k">손익비</span><span class="v">${pf}</span></div>
     <div class="row"><span class="k">AI 호출(토큰)</span><span class="v">${m.tokenCalls||0}번</span></div>`);
}

async function tick(){
  if(document.hidden) return;
  try{
    const r=await fetch('/api/backtest/state',{cache:'no-store'});
    const d=await r.json();
    const run=$('run');
    if(!d.ok){ run.className='chip off'; run.textContent='미실행';
      $('clock').textContent='--:--'; $('date').textContent=d.error||'백테스트가 아직 안 돌고 있어요';
      $('grid').innerHTML='<div class="muted-card">백테스트를 시작하면 표시돼요. (python scripts/run_backtest.py)</div>'; return; }
    run.className='chip '+(d.running?'on':'off'); run.textContent=d.running?'● 실행중':'정지/완료';
    $('clock').textContent=(d.sim&&d.sim.time)? d.sim.time.slice(0,5):'--:--';
    const dd=(d.sim&&d.sim.date)||''; $('date').textContent='백테스트 날짜 '+(dd?`${dd.slice(0,4)}.${dd.slice(4,6)}.${dd.slice(6,8)}`:'—');
    $('score').textContent=(d.agents&&d.agents.meta&&d.agents.meta.perfScore!=null)?d.agents.meta.perfScore:'–';
    const a=d.agents||{};
    $('grid').innerHTML=[renderCEO(a),renderScreening(a),renderMarket(a),renderSignal(a),renderRisk(a),renderOrder(a),renderLearning(a),renderMeta(a)].join('');
  }catch(e){ $('run').className='chip off'; $('run').textContent='연결 끊김'; }
}
tick(); setInterval(tick, 3000);
</script>
</body>
</html>
